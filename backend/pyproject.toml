[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "askact"
version = "0.1.0"
description = "Ask the EU AI Act: a small RAG app with citations"
requires-python = ">=3.12"
# Runtime dependencies are added by the task that first uses them, so nothing sits here unused.
dependencies = [
    # 2.7 is the oldest release that has `NoDecode` (tested: 2.6.1 fails to import it, 2.7.0 passes).
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# Real local embedding/reranker models (pulls torch). Not needed for tests or CI, which use stubs.
models = [
    "sentence-transformers",
]

[tool.setuptools.packages.find]
include = ["askact*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets tests/ mirror the package (tests/ingest/test_parse.py, ...) without
# __init__.py files or basename clashes.
# `slow` tests need real models, the real source file, or a provider key: local only, never in CI.
# They are skipped by default; run them with `pytest -m slow`.
addopts = "--import-mode=importlib --strict-markers -m 'not slow'"
markers = [
    "slow: needs real models, the real source file, or a live provider key; run locally with `pytest -m slow`",
]
