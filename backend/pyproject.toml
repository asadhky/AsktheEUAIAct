[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "askact"
version = "0.1.0"
description = "Ask the EU AI Act: a small RAG app with citations"
requires-python = ">=3.12"
# Runtime dependencies are added by the task that first uses them, so nothing sits here unused.
dependencies = [
    # Tested clean from 0.23.3 to 0.28.1 (0.22.0 passes with a warning; older versions are untested).
    "httpx>=0.23",
    # The parser reads the XHTML with bs4's "xml" builder, which needs lxml. The oldest pair tried
    # was bs4 4.12.3 with lxml 5.2.2; the tests pass from there to the latest (bs4 4.15.0, lxml 6.1.3).
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    # The embedders return numpy arrays, and the stub is built on it. Declared here because the
    # `models` extra (which also brings numpy) is not installed in CI. Tested from 1.26.4 to 2.5.3.
    "numpy>=1.26.4",
    # 2.7 is the oldest release that has `NoDecode` (tested: 2.6.1 fails to import it, 2.7.0 passes).
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# Real local embedding/reranker models (pulls torch). Not needed for tests or CI, which use stubs.
models = [
    # The slow token-length test gives identical results on 3.4.1, 5.1.0 and 6.1.0 (older is untested).
    # Install torch's CPU wheel first to avoid pulling gigabytes of GPU libraries:
    #   pip install torch --index-url https://download.pytorch.org/whl/cpu
    "sentence-transformers>=3.4.1",
]

[tool.setuptools.packages.find]
include = ["askact*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets tests/ mirror the package (tests/ingest/test_parse.py, ...) without
# __init__.py files or basename clashes.
# `slow` tests need real models, the real source file, or a provider key: local only, never in CI.
# They are skipped by default; run them with `pytest -m slow`.
addopts = "--import-mode=importlib --strict-markers -m 'not slow'"
markers = [
    "slow: needs real models, the real source file, or a live provider key; run locally with `pytest -m slow`",
]
