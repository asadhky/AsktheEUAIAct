name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Stubs and the fake provider: no model download, no network calls from the tests, no secrets.
    env:
      EMBEDDER: stub
      RERANKER: stub
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        # `slow` tests need real models or keys and run locally only.
        run: pytest -m "not slow"
