name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Stubs and the fake provider: no model download, no network calls from the tests, no secrets.
    env:
      EMBEDDER: stub
      RERANKER: stub
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        # `slow` tests need real models or keys and run locally only.
        run: pytest -m "not slow"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The same Node as frontend/Dockerfile (22, an LTS line), so CI builds what the image builds.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        # `ci` installs exactly what package-lock.json says and fails if it disagrees with package.json.
        run: npm ci
      - name: Test
        # vitest run (the `test` script). `fetch` is mocked in every test: no backend, no secrets, no network.
        run: npm test
      - name: Build
        # next build also type-checks. NEXT_PUBLIC_API_URL is left unset: the build must not need a backend.
        run: npm run build
