# Evaluation questions for "Ask the EU AI Act" (50 questions: 29 dev, 21 test).
#
# AUTHORSHIP: written by the project owner, before any evaluation scores were seen.
#
# How they were made
#   * expected_ids lists operative provisions only (articles and annexes). Recitals that discuss the same
#     topic are NOT listed, so a retrieved recital counts as a miss even when it is on topic. Expect hit@k
#     to understate retrieval a little for that reason.
#   * Dev/test: within each category, a seeded shuffle (Python random.Random(2026)) sent 60% to dev
#     and the rest to test, so neither split was picked by hand. Tune only on dev (R5.10).
#   * Do not edit a question after seeing how it scores. Fixing a wrong expected id is fine, but say so.
#
# Format: see askact/evaluation/schema.py.
#   split: dev | test        category: direct | paraphrase | multi | out_of_scope
#   expected_ids: section ids such as article:5 or annex:III; [] exactly for out_of_scope.
#   All listed sections are relevant (not alternatives): a hit needs any one, citation recall needs all.

# ---- direct: Wording taken from the Act. One section answers each.

- id: q001
  question: "What is the maximum administrative fine for non-compliance with the prohibition of AI practices referred to in Article 5?"
  split: dev
  category: direct
  expected_ids: [article:99]

